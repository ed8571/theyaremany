name: Build

on:
  push:
    branches: [main, master]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # True only for bare semver tags (1.2.3) - the release trigger.
      is-release-tag: ${{ steps.tag.outputs.is-release-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-release-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release-tag=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.x

      - name: Build
        run: dotnet build Source/theyaremany/theyaremany.slnx --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Validate mod XML
        run: |
          python3 - <<'EOF'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          bad = False
          for base in ("About", "Defs"):
              for p in pathlib.Path(base).rglob("*.xml"):
                  try:
                      ET.parse(p)
                  except ET.ParseError as e:
                      print(f"{p}: {e}")
                      bad = True
          sys.exit(1 if bad else 0)
          EOF

      - name: Package
        run: |
          mkdir -p dist/theyaremany
          cp -r About Defs Assemblies dist/theyaremany/
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            sed -i "s|<modVersion>[^<]*</modVersion>|<modVersion>${GITHUB_REF_NAME}</modVersion>|" dist/theyaremany/About/About.xml
          fi
          cd dist
          zip -r "theyaremany-${GITHUB_REF_NAME}.zip" theyaremany

      - uses: actions/upload-artifact@v4
        with:
          name: theyaremany-${{ github.run_id }}
          path: dist/theyaremany-*.zip
          if-no-files-found: error

  release:
    if: needs.build.outputs.is-release-tag == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theyaremany-${{ github.run_id }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
